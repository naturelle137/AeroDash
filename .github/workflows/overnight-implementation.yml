name: Overnight Autonomous Implementation

# Autonomously implements triaged `accepted` + `engineering` issues from the
# current milestone and opens reviewable **Draft** PRs to `develop`.
# Governed by ADR-317-DEV. Safety invariants enforced here:
#   * Draft-only output, never auto-merge, never mark ready-for-review.
#   * Selection is deterministic + dependency-aware (.github/scripts/select-issues.mjs).
#   * Bounded effort per issue (timeout + --max-turns).
#   * Ships DISABLED: nightly runs require repo variable AUTOMATION_ENABLED=true.
# refs #317, #316

on:
  schedule:
    # 02:00 UTC nightly. Only runs when AUTOMATION_ENABLED=true (see select.if).
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Implement exactly this issue (bypasses selection). Leave blank for normal selection.'
        required: false
        type: string
        default: ''
      batch_size:
        description: 'Max issues to implement this run (overrides default).'
        required: false
        type: string
        default: ''
      model:
        description: 'Model override (alias e.g. opus[1m], sonnet, or pinned ID).'
        required: false
        type: string
        default: ''
      effort:
        description: 'Reasoning effort override (low | medium | high | xhigh | max).'
        required: false
        type: string
        default: ''
      max_turns:
        description: 'One-off --max-turns override for this run (integer). Leave blank to use MAX_TURNS default.'
        required: false
        type: string
        default: ''
      scope:
        description: 'Narrow selection to one scope. "any" = all accepted issues (product + engineering).'
        required: false
        type: choice
        options: [any, engineering, product]
        default: any
      dry_run:
        description: 'Plan only — compute and report the queue, open no branches or PRs.'
        required: false
        type: boolean
        default: false

# Never cancel an in-flight implementation; serialise runs instead.
concurrency:
  group: overnight-implementation
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # required by anthropics/claude-code-action (OIDC)

env:
  # Alias form so the bot tracks the LATEST Opus + 1M-context variant
  # automatically (per code.claude.com/docs/en/model-config: "Aliases point to
  # the recommended version for your provider and update over time"). Pinning
  # to a specific version like `claude-opus-4-7[1m]` would silently go stale
  # whenever Anthropic ships a newer Opus. Wrapped in single quotes so YAML
  # does not parse `[1m]` as a flow sequence. Override via workflow_dispatch
  # `model` input if a specific version is ever needed.
  MODEL_DEFAULT: 'opus[1m]'
  # `xhigh` is the documented default reasoning level for Opus 4.7/4.8 —
  # pinned explicitly so a future CLI/default change does not silently
  # downgrade implementation runs.
  EFFORT_DEFAULT: 'xhigh'
  BATCH_SIZE_DEFAULT: '1'
  # Per-issue budgets (ADR-317-DEV operational defaults). 40 turns proved far
  # too small: run #4 hit `error_max_turns` mid-implementation (the agent was
  # working, not stuck), and 150 likewise hit the cap on a real run. A full
  # /implement-issue + lint/type-check/test/build + fix loop needs a much
  # larger cap, so the turn budget — not the wall clock — is the binding
  # limit and the graceful-degradation push step below can run.
  MAX_TURNS: '250'
  # Mirrors the job-level `timeout-minutes` below. GitHub does not expose the
  # workflow `env` context to a job-level `timeout-minutes`, so keep them in sync.
  RUN_TIMEOUT_MINUTES: '150'

jobs:
  # ── Deterministic, dependency-aware selection + run report ──────────────────
  select:
    name: Select issues
    runs-on: ubuntu-latest
    # Kill switch: scheduled runs require AUTOMATION_ENABLED=true; manual
    # dispatch is always allowed (explicit operator intent).
    if: ${{ github.event_name != 'schedule' || vars.AUTOMATION_ENABLED == 'true' }}
    outputs:
      queue: ${{ steps.select.outputs.queue }}
      has_work: ${{ steps.select.outputs.has_work }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve current milestone
        id: ms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ vars.CURRENT_MILESTONE }}" ]; then
            MS="${{ vars.CURRENT_MILESTONE }}"
          else
            # Active milestone = lowest-numbered OPEN milestone (earliest unfinished release).
            MS=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open" --jq 'sort_by(.number)[0].number // empty')
          fi
          echo "Active milestone: ${MS:-<none>}"
          echo "milestone=$MS" >> "$GITHUB_OUTPUT"

      - name: Build selection queue
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MS: ${{ steps.ms.outputs.milestone }}
          ISSUE_INPUT: ${{ github.event.inputs.issue_number }}
          BATCH_INPUT: ${{ github.event.inputs.batch_size }}
          SCOPE_INPUT: ${{ github.event.inputs.scope }}
        run: |
          set -euo pipefail
          BATCH="${BATCH_INPUT:-}"; BATCH="${BATCH:-$BATCH_SIZE_DEFAULT}"
          ISSUE="${ISSUE_INPUT:-}"
          SCOPE="${SCOPE_INPUT:-any}"

          # Candidate set: open + accepted, ANY scope by default (product + engineering).
          # Optionally narrow to one scope label (gh ANDs --label flags).
          LABEL_ARGS=(--label accepted)
          REQUIRED='["accepted"]'
          if [ "$SCOPE" = "engineering" ] || [ "$SCOPE" = "product" ]; then
            LABEL_ARGS+=(--label "$SCOPE")
            REQUIRED=$(jq -nc --arg s "$SCOPE" '["accepted",$s]')
          fi
          gh issue list --state open "${LABEL_ARGS[@]}" \
            --json number,title,labels,milestone,body,createdAt --limit 200 > candidates.json
          # All open issue numbers — used to resolve whether a dependency is unresolved.
          gh issue list --state open --json number --limit 500 --jq '[.[].number]' > open.json

          # Issues whose work is already in flight in an open `feature/issue-<n>` PR —
          # the selector defers these so a done-but-not-merged ticket isn't re-picked.
          gh pr list --state open --json headRefName --limit 200 \
            --jq '[.[].headRefName | select(test("^feature/issue-[0-9]+$")) | capture("issue-(?<n>[0-9]+)").n | tonumber]' \
            > open_pr_issues.json

          # GitHub NATIVE sub-issues per current-milestone candidate → defer parents
          # that still have open children (native links, not just body-text parents).
          echo '{}' > native_children.json
          for n in $(jq -r --arg ms "${MS:-0}" '.[] | select((.milestone.number // 0) == ($ms|tonumber)) | .number' candidates.json); do
            kids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/sub_issues" \
              --jq '[.[] | select(.state=="open") | .number]' 2>/dev/null || echo '[]')
            [ "$kids" = '[]' ] && continue
            jq --arg p "$n" --argjson k "$kids" '.[$p]=$k' native_children.json > native_children.tmp
            mv native_children.tmp native_children.json
          done

          jq -n \
            --slurpfile c candidates.json \
            --slurpfile o open.json \
            --slurpfile pr open_pr_issues.json \
            --slurpfile nc native_children.json \
            --arg ms "${MS:-}" \
            --arg batch "$BATCH" \
            --arg issue "$ISSUE" \
            --argjson required "$REQUIRED" \
            '{
               issues: $c[0],
               openIssueNumbers: $o[0],
               issuesWithOpenPr: $pr[0],
               nativeChildrenByParent: $nc[0],
               currentMilestone: (if $ms == "" then null else ($ms|tonumber) end),
               batchSize: ($batch|tonumber),
               requiredLabels: $required,
               issueNumber: (if $issue == "" then null else ($issue|tonumber) end)
             }' > envelope.json

          node .github/scripts/select-issues.mjs < envelope.json > result.json

          jq -r .report result.json >> "$GITHUB_STEP_SUMMARY"
          echo "queue=$(jq -c '[.queue[].number]' result.json)" >> "$GITHUB_OUTPUT"
          echo "has_work=$(jq -r 'if (.queue|length) > 0 then "true" else "false" end' result.json)" >> "$GITHUB_OUTPUT"

  # ── Implement each selected issue → Draft PR (serialised) ───────────────────
  implement:
    name: Implement #${{ matrix.issue }}
    needs: select
    if: ${{ needs.select.outputs.has_work == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    # Keep in sync with RUN_TIMEOUT_MINUTES. Must exceed the wall-clock time
    # MAX_TURNS can consume, so the agent's own turn cap is hit first and the
    # graceful-degradation push step runs (a hard job timeout cancels everything).
    timeout-minutes: 150
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.queue) }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          # A PAT (or GitHub App token) is required so the Draft PR triggers CI
          # and the reviewer bot; the default GITHUB_TOKEN cannot trigger them.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      # Pre-install so `pnpm` is on PATH and Husky hooks are active before the
      # agent runs the pipeline. Without a pnpm setup the agent's `pnpm install`
      # cannot resolve the binary at all; pre-installing also primes the cache
      # and stops the agent burning turns bootstrapping the toolchain.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create feature branch
        run: |
          git config user.name 'aerodash-bot'
          git config user.email 'aerodash-bot@users.noreply.github.com'
          git switch -c "feature/issue-${{ matrix.issue }}"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Implement via Claude Code
        id: claude
        # Budget exhaustion (error_max_turns) and other agent errors must NOT
        # discard partial work: keep the job alive so the push step below can
        # still open a Draft PR from whatever was committed (ADR-317-DEV §5 —
        # "the Draft PR is handed to humans with a summary"). The agent outcome
        # is surfaced via steps.claude.outcome in that step.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Swap the line above for the API-key path if preferred:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # On real CI this is empty, so the action mints a GitHub token via OIDC
          # (needs `id-token: write`, see permissions block). Under local `act`
          # there is no OIDC provider, so we hand it the runner token directly —
          # the action skips the OIDC exchange when github_token is set. Empty on
          # CI ⇒ unchanged production behaviour.
          github_token: ${{ env.ACT == 'true' && secrets.GITHUB_TOKEN || '' }}
          # The action's bot-actor safety gate refuses non-human initiators by
          # default. The cron trigger runs as `github-actions` so it is unaffected
          # today, but `workflow_dispatch` invocations made via the GitHub API by
          # `claude[bot]` (or any future bot-driven rerun) would be rejected. We
          # whitelist ONLY `claude` for parity with the other two automation
          # workflows (pr-iteration.yml from #348, pr-review-bot.yml from #350) —
          # never `*`, which is documented as unsafe on public repos.
          allowed_bots: 'claude'
          prompt: |
            /implement-issue ${{ matrix.issue }}

            ↑ Execute the slash command above as your FIRST action. It IS the
            authoritative procedure (the `implement-issue` skill, CLAUDE.md,
            CONTRIBUTING.md, and ADR-317-DEV govern everything: DoD attestation,
            Closes/Refs, Conventional Commits, Husky/quality gates, P1 isolation,
            traceability, project board, stop conditions). Do not paraphrase or
            re-derive them — invoke the skill and follow what it tells you.

            You are running unattended in CI on branch feature/issue-${{ matrix.issue }}.
            ${{ env.ACT == 'true' && 'LOCAL ACT TEST RUN — make NO remote/GitHub changes: no project-board claim or move, no issue assignment, no label edits, no issue comments, no PR or sub-issue creation, and do NOT git push to any remote. Only read from GitHub, edit files, run the pipeline, and commit locally. (This line is empty on real CI.)' || '' }}

            CI-only adaptations (the skill assumes an interactive developer; CI has
            none, so these four points override / extend the skill's defaults):

            1. The workflow opens the PR, not you. Write the filled-out body
               (per `.github/pull_request_template.md`, applying the skill's
               Closes/Refs + DoD-attestation logic) to `$RUNNER_TEMP/pr-body.md`.
               Do not run `gh pr create`. Do not mark anything ready-for-review —
               the ready-gate flips it once CI + the automated review are clean.
            2. Husky only runs lint-staged on commit, so verify the rest of the
               pipeline locally before the workflow pushes: `pnpm lint`,
               `pnpm --filter frontend type-check`, `pnpm test:unit`,
               `pnpm test:integration`, `pnpm build`. Fix anything you introduced.
            3. ADR-317-DEV scope guard: do NOT edit `.github/workflows/**`,
               repository secrets, or security configuration in this run.
            4. The turn/time budget is generous — finish the ENTIRE issue. If a
               step is genuinely blocked, complete the rest, follow the skill's
               stop-condition + Refs-vs-Closes guidance, and explain "what remains"
               in the PR body file.
          # claude-code-action does NOT grant Bash by default, and CI has no
          # human to approve tool prompts — so without an explicit allow-list the
          # agent's pnpm/git/gh commands are all auto-denied and it produces zero
          # commits (observed in runs #2/#3: permission_denials_count > 0 →
          # "No commits produced"). --allowedTools MERGES with the action's
          # baseline (file ops + GitHub tools); we add Bash plus search/task
          # tools needed by the /implement-issue flow. Safety is unchanged: it
          # rests on the Draft-only + human-Lead-review + CI-gate regime
          # (ADR-317-DEV), not on local permission gating — the Draft PR re-runs
          # every gate and is never auto-merged.
          claude_args: |
            --model ${{ github.event.inputs.model || env.MODEL_DEFAULT }}
            --effort ${{ github.event.inputs.effort || env.EFFORT_DEFAULT }}
            --max-turns ${{ github.event.inputs.max_turns || env.MAX_TURNS }}
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch,Skill"

      - name: Push branch & open Draft PR
        # Runs even when the agent step reported failure (continue-on-error above)
        # so partial work is never silently dropped. Skipped only on cancellation
        # (e.g. hard job timeout), where the runner is being torn down anyway.
        # `!env.ACT` makes local `act` runs validate the agent without pushing a
        # branch or opening a real PR; on GitHub `env.ACT` is unset so it runs.
        if: ${{ !cancelled() && !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            echo "No commits produced for #${{ matrix.issue }} (agent outcome: ${AGENT_OUTCOME}) — skipping PR."
            if [ "$AGENT_OUTCOME" = "success" ]; then
              NOTE="completed but produced no changes"
            else
              NOTE="could not complete (agent outcome: \`${AGENT_OUTCOME}\` — e.g. ran out of turn/time budget) and produced no commits"
            fi
            gh issue comment "${{ matrix.issue }}" --body \
              "🤖 Overnight automation ${NOTE}; left for human attention."
            exit 0
          fi
          # Partial-work banner when the agent did not report success.
          PARTIAL_NOTE=""
          if [ "$AGENT_OUTCOME" != "success" ]; then
            PARTIAL_NOTE="

          > ⚠️ **Partial draft** — the agent did not report success (outcome: \`${AGENT_OUTCOME}\`, likely the turn/time budget). This is work-in-progress that a human must finish; review the diff for completeness before relying on it."
          fi
          # claude-code-action strips the PAT auth that actions/checkout set up
          # and repoints origin at its own claude[bot] token, which cannot push
          # here. Plain `git push` does not read GH_TOKEN, so re-establish auth
          # with AUTOMATION_PAT on a clean URL before pushing.
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git push --set-upstream origin "feature/issue-${{ matrix.issue }}"
          TITLE=$(gh issue view "${{ matrix.issue }}" --json title --jq .title)
          # Prefer the agent-authored, PR-template-filled body it wrote to
          # $RUNNER_TEMP/pr-body.md (mandatory template + correct Closes/Refs). Fall
          # back to a minimal refs-only body — with NO close/fix/resolve tokens, so
          # the DoD gate does not false-trigger — only when the agent produced none
          # (e.g. it failed). Append the partial banner when the agent didn't succeed.
          PR_BODY_FILE="${RUNNER_TEMP}/pr-body.md"
          if [ -s "$PR_BODY_FILE" ]; then
            [ -n "$PARTIAL_NOTE" ] && printf '%s\n' "$PARTIAL_NOTE" >> "$PR_BODY_FILE"
            PR_URL=$(gh pr create --draft --base develop \
              --head "feature/issue-${{ matrix.issue }}" \
              --title "feat: ${TITLE} (#${{ matrix.issue }})" \
              --body-file "$PR_BODY_FILE")
          else
            PR_URL=$(gh pr create --draft --base develop \
              --head "feature/issue-${{ matrix.issue }}" \
              --title "feat: ${TITLE} (#${{ matrix.issue }})" \
              --body "🤖 Autonomous draft for #${{ matrix.issue }} (refs #${{ matrix.issue }}). Agent outcome: \`${AGENT_OUTCOME}\`. The agent did not produce a PR description from the template — treat as work-in-progress that a human must complete before merge.${PARTIAL_NOTE}")
          fi
          # Per-issue summary comment (run report links from the job summary).
          gh issue comment "${{ matrix.issue }}" --body \
            "🤖 Overnight automation opened a Draft PR for this issue: ${PR_URL} (agent outcome: ${AGENT_OUTCOME}). It is a Draft pending human review (Lead review required for P1/safety-critical)."
