name: 🔨 Sub-Task
description: For Developers only - Break down a feature into technical steps.
title: "[Task]: "
labels: ["Task", "open"]
body:
  - type: markdown
    attributes:
      value: |
        > 🛑 **For Developers Only**
        > This template is strictly for breaking down technical implementation tasks.
        >
        > * **Found a bug?** Please use the [Bug Report](../issues/new?template=bug_report.yml).
        > * **Have an idea?** Please use the [Feature Request](../issues/new?template=feature_request.yml).
        > * **Security Issue?** Please check our [Security Policy](../security/policy).
        > * **Questions?** Please start a [Discussion](../discussions).

  - type: input
    id: parent_issue
    attributes:
      label: Parent Feature / Issue
      description: Which Feature or Bug does this task belong to? Please provide the Issue Number (#123) or Link.
      placeholder: "#15"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: What exactly needs to be implemented? (Keep it specific and actionable)
      placeholder: Implement the API route for POST /calculate-wb...
    validations:
      required: true

  - type: textarea
    id: technical_details
    attributes:
      label: Technical Details / Implementation Plan
      description: Implementation hints, affected files, or specific libraries to use.
      placeholder: |
        - Use the 'aviation-math' library
        - Must achieve 100% unit test coverage
        - File: src/services/wb_calculator.ts

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done (DoD)
      options:
        - label: Implementation is complete.
          required: false
        - label: Unit tests are written and passing.
          required: false
        - label: Linter/Formatter (Prettier/ESLint) checks pass.
          required: false
        - label: I have checked for side effects on other modules.
          required: false
