name: Linting

on:
  push:
    paths:
      - '**/*.md'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - '**/*.md'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for changed-files analysis

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        uses: step-security/changed-files@v47
        with:
          files: |
            **/*.md

      - name: Lint Changed Markdown Files (Push & PR to develop)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        run: |
          echo "Linting changed files..."
          if [ -n "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            pnpm exec markdownlint-cli2 ${{ steps.changed-files.outputs.all_changed_files }}
          else
            echo "No markdown files changed."
          fi

      - name: Lint FULL Repository (PR to main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "Linting ALL Markdown files in the repository..."
          pnpm run lint:md

  lint-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for changed-files analysis

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        uses: step-security/changed-files@v47
        with:
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx

      - name: Lint Changed Code Files (Push & PR to develop)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        run: |
          echo "Linting changed files..."
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -n "$FILES" ]; then
            FRONTEND_FILES=$(echo "$FILES" | tr ' ' '\n' | sed 's|^frontend/||' | tr '\n' ' ')
            pnpm --filter frontend run lint:ci:oxlint -- $FRONTEND_FILES
            pnpm --filter frontend run lint:ci:eslint -- $FRONTEND_FILES
          else
            echo "No code files changed."
          fi

      - name: Lint FULL Repository (PR to main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "Linting ALL Code files in the repository..."
          pnpm --filter frontend run lint:ci:oxlint
          pnpm --filter frontend run lint:ci:eslint
