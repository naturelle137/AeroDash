name: Mutation Score (P1 Safety Core)

# Second line of defence behind P1 unit-test coverage: Stryker introduces
# semantics-changing mutants into `frontend/src/core/**` and re-runs the
# isolated P1 unit suite. A surviving mutant is a P1 test that executes a
# code path without meaningfully asserting on its output — i.e. a defect
# the unit suite would have missed in production.
#
# The runner config (`frontend/stryker.config.mjs`) pins:
#   • mutate scope → `frontend/src/core/**/*.ts` (no specs / fixtures /
#     type-only / test helpers)
#   • thresholds → high=85, low=70, break=70
#
# A score below `thresholds.break` exits Stryker non-zero, so this job
# fails the pipeline — there is intentionally NO `continue-on-error`. The
# job is allowed to be slow: it runs in parallel with the rest of `ci.yml`
# and does not block faster gates.
#
# Refs: issue #260 (TECH-007/PR-015 from the v0.3.0-alpha release audit),
#       docs/testing/TESTING.md §7,
#       docs/architecture/adr/314-DEV-dependency-isolation.md (P1 isolation
#       reused via vitest.config.p1.ts).

on:
  pull_request:
    branches: [develop, main]
    paths:
      # Run when something the mutation gate actually depends on changes.
      # Anything else (docs, P2/P3 UI tweaks, workflow polish) is out of
      # scope for the P1 mutation score and would only burn CI minutes.
      - 'frontend/src/core/**'
      - 'frontend/stryker.config.mjs'
      - 'frontend/vitest.config.p1.ts'
      - 'frontend/tsconfig.stryker.json'
      - 'frontend/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mutation.yml'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-score:
    name: P1 Mutation Score
    runs-on: ubuntu-latest
    # Generous wall-clock budget — Stryker re-runs the P1 vitest suite for
    # every generated mutant. The current P1 scope is small enough that
    # this typically completes in well under the cap, but a regression in
    # P1 size or test runtime should fail loudly rather than be masked by
    # a tight timeout.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: explicitly NOT marked `continue-on-error`. The Stryker config
      # exits non-zero when the score drops below `thresholds.break=70`, so
      # any regression in the P1 mutation score must fail the PR check.
      - name: Run Stryker mutation tests (P1 Safety Core)
        run: pnpm --filter frontend test:mutation

      # Always upload the HTML report so reviewers can triage survivors,
      # even when the gate has just failed.
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: mutation-report
          path: frontend/reports/mutation/
          retention-days: 14
