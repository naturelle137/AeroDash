name: Automated Release

on:
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: write

jobs:
  release:
    name: Bump version & publish changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for existing release commit
        id: check-release
        run: |
          LAST_COMMIT=$(git log -1 --pretty=%s)
          if echo "$LAST_COMMIT" | grep -qE '^chore\(repo\): release v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release commit already present — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release-it (CI mode)
        if: steps.check-release.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release --ci --no-git.tag --no-github.release
