name: Bounded PR Iteration Loop

# Closes the implement -> review -> correct loop for BOT-authored Draft PRs.
#
# Flow (ADR-317-DEV):
#   implement -> review #1 -> correction #1 -> review #2
#     -> if no/only-minor findings: STOP, wait for human review
#     -> else: correction #2 -> review #3 (final) -> STOP, wait for human review
#
# So: at most MAX_CORRECTIONS (default 2) automated correction rounds, with a
# re-review after each. The severity early-exit is implicit: the reviewer only
# emits `changes_requested` for Blocker/Major findings (Minor/Nit -> `COMMENT`),
# and only `changes_requested` triggers a correction here.
#
# Safety: P1/safety-critical stays Draft; never merges, never marks
# ready-for-review, gates never bypassed.
# refs #320, #316

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: pr-iteration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  MODEL: claude-opus-4-7
  MAX_CORRECTIONS: '2'
  MAX_TURNS: '40'

jobs:
  iterate:
    name: Correct on review feedback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only for: same-repo + bot-authored Draft (feature/issue-*) + REQUEST_CHANGES.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/issue-') &&
      github.event.review.state == 'changes_requested'
    steps:
      - name: Evaluate correction budget
        id: gate
        uses: actions/github-script@v9
        env:
          MAX_CORRECTIONS: ${{ env.MAX_CORRECTIONS }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const max = Number(process.env.MAX_CORRECTIONS);
            const marker = '<!-- auto-correction:';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const used = comments.filter((c) => (c.body || '').includes(marker)).length;
            const proceed = used < max;
            core.info(`Corrections used: ${used}/${max} — proceed=${proceed}`);
            core.setOutput('used', String(used));
            core.setOutput('next', String(used + 1));
            core.setOutput('max', String(max));
            core.setOutput('proceed', String(proceed));

      - name: Hand off to humans (final review reached)
        if: ${{ steps.gate.outputs.proceed == 'false' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const max = '${{ steps.gate.outputs.max }}';
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `🤖 **Automated cycle complete — awaiting your review.**\n\n` +
                `This Draft PR has had its ${max} automated correction round(s) plus a ` +
                `final review and still has outstanding feedback. No further automated ` +
                `corrections will run. Please review the remaining findings and take it ` +
                `from here (ADR-317-DEV).`,
            });

      - name: Checkout PR branch
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure git
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          git config user.name 'aerodash-bot'
          git config user.email 'aerodash-bot@users.noreply.github.com'
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Correct via Claude Code
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API-key alternative: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are correcting Draft PR #${{ github.event.pull_request.number }} in
            response to a review that requested changes
            (correction ${{ steps.gate.outputs.next }} of ${{ steps.gate.outputs.max }}).

            Read the most recent PR review and its line comments, then implement
            the requested changes on the CURRENT branch and commit them.

            Hard rules (ADR-317-DEV — do not violate):
            - Honour every quality gate. NEVER use --no-verify.
            - Do NOT edit .github/workflows/**, secrets, or security configuration.
            - Do NOT merge, do NOT mark the PR ready-for-review — keep it Draft.
            - Distinguish failure scope: if a CI failure is caused by YOUR change,
              fix it here; if it is pre-existing/unrelated (out of scope), do NOT
              hack around it — instead file a deduplicated `Bug` issue (open a new
              one only if no open bug already tracks the same failure; otherwise
              comment on the existing one) and note it in the PR.
            - If you cannot safely converge, stop and summarise what remains.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns ${{ env.MAX_TURNS }}

      - name: Push correction & record round
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR='${{ github.event.pull_request.number }}'
          N='${{ steps.gate.outputs.next }}'
          MAX='${{ steps.gate.outputs.max }}'
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            gh pr comment "$PR" --body \
              "<!-- auto-correction:${N} --> 🤖 Correction ${N}/${MAX}: no actionable change could be made automatically. Awaiting your review."
            exit 0
          fi
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          gh pr comment "$PR" --body \
            "<!-- auto-correction:${N} --> 🤖 Correction ${N}/${MAX}: pushed a revision addressing review feedback. A re-review will run automatically. Still a Draft — human Lead review required for P1/safety-critical."
