name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Only PR runs are cancelled when superseded; every push run is keyed by its
# own SHA so each resulting commit keeps its own evidence.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect applicable gates
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mutation_required: ${{ steps.decide.outputs.mutation_required }}
    steps:
      - id: decide
        run: echo "mutation_required=true" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint]
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint]
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [type-check, unit-tests]
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [build]
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  lint-markdown:
    name: lint-markdown
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint]
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  mutation:
    name: P1 Mutation Score
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, forced-skip]
    if: ${{ needs.changes.outputs.mutation_required == 'true' }}
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Evidence-only fixture; no application validation"

  forced-skip:
    name: Evidence skipped dependency
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - run: exit 0

  ci-required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - changes
      - lint
      - lint-markdown
      - type-check
      - unit-tests
      - integration
      - build
      - e2e
      - mutation
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Evaluator behavioural tests
        run: node --test .github/scripts/ci-required.test.mjs

      - name: Evaluate required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-required.mjs
