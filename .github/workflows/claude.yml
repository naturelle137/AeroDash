name: Claude Code

# On-demand Claude assistant: when an `@claude` mention appears in a new
# issue, an issue/PR comment, or a PR review, this workflow runs
# `anthropics/claude-code-action@v1` against the repo so Claude can answer
# questions, draft changes, or open PRs from the conversation thread.
#
# Auth: uses `secrets.CLAUDE_CODE_OAUTH_TOKEN` (already configured in the
# repo). For OIDC-bound short-lived tokens the action needs
# `permissions.id-token: write`.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Serialise per conversation thread so concurrent @claude mentions on the
# same issue/PR don't race each other into duplicate responses.
concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Alias form — tracks the LATEST Sonnet automatically (per
  # code.claude.com/docs/en/model-config: aliases "update over time"). Sonnet
  # is fast enough for interactive @claude turns; `high` effort matches the
  # repo's other bots (pr-review-bot, overnight-implementation).
  CLAUDE_MODEL: 'sonnet'
  CLAUDE_EFFORT: 'high'

jobs:
  claude:
    name: Respond to @claude mention
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run when `@claude` actually appears in the event payload — avoids
    # spinning a runner on every comment in the repo.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    permissions:
      contents: write           # claude may push branches / commits
      pull-requests: write      # comment on / open PRs
      issues: write             # comment on issues
      actions: read             # inspect CI status when asked
      id-token: write           # OIDC for claude-code-action
    steps:
      # `secrets` cannot be used in a job-level `if`, so gate on a guard step:
      # when auth is not configured (e.g. before operator setup) skip cleanly
      # instead of hard-failing every @claude mention.
      - name: Check auth configured
        id: guard
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$OAUTH" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not configured — skipping @claude response."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ steps.guard.outputs.configured == 'true' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Claude Code
        if: ${{ steps.guard.outputs.configured == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow `claude[bot]` to initiate a turn (e.g. when a bot-authored
          # PR thread @-mentions claude). `*` would be unsafe on a public
          # repo — only whitelist this one bot, same convention as
          # pr-review-bot.yml.
          allowed_bots: 'claude'
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --effort ${{ env.CLAUDE_EFFORT }}
