name: Unit Tests (Vitest)

on:
  push:
    # Post-merge regression check on integration branches.
    # PRs are covered by the unit-tests job in ci.yml instead.
    branches: [main, develop]
    paths:
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'frontend/vitest.config*'
      - 'frontend/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit
