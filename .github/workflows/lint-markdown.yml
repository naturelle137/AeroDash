name: Markdown Linting

on:
  push:
    paths:
      - '**/*.md'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - '**/*.md'

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changed-files analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        uses: step-security/changed-files@v47
        with:
          files: |
            **/*.md

      - name: Lint Changed Markdown Files (Push & PR to develop)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        run: |
          echo "Linting changed files..."
          if [ -n "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            npx markdownlint-cli2 ${{ steps.changed-files.outputs.all_changed_files }}
          else
            echo "No markdown files changed."
          fi

      - name: Lint FULL Repository (PR to main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "Linting ALL Markdown files in the repository..."
          npm run lint:md
