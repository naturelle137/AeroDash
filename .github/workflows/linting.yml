name: Linting

on:
  push:
    paths:
      - '**/*.md'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - '**/*.md'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changed-files analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Disable husky
        run: echo "HUSKY=0" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        uses: step-security/changed-files@v47
        with:
          files: |
            **/*.md

      - name: Lint Changed Markdown Files (Push & PR to develop)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        run: |
          echo "Linting changed files..."
          if [ -n "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            npx markdownlint-cli2 ${{ steps.changed-files.outputs.all_changed_files }}
          else
            echo "No markdown files changed."
          fi

      - name: Lint FULL Repository (PR to main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "Linting ALL Markdown files in the repository..."
          npm run lint:md

  lint-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changed-files analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Rebuild oxlint
        run: npm rebuild oxlint

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        uses: step-security/changed-files@v47
        with:
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx

      - name: Lint Changed Code Files (Push & PR to develop)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        run: |
          echo "Linting changed files..."
          if [ -n "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            npx oxlint ${{ steps.changed-files.outputs.all_changed_files }} -w frontend
            npx eslint ${{ steps.changed-files.outputs.all_changed_files }} -w frontend
          else
            echo "No code files changed."
          fi

      - name: Lint FULL Repository (PR to main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "Linting ALL Code files in the repository..."
          npx oxlint . -w frontend
          npx eslint . -w frontend
