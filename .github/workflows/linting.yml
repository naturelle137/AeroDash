name: Linting

on:
  push:
    # Quick per-commit lint feedback on feature branches.
    # PRs to develop/main are fully linted by ci.yml instead.
    branches-ignore:
      - develop
      - main
    paths:
      - '**/*.md'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - .github/workflows/linting.yml

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get changed Markdown files
        id: changed-files
        uses: step-security/changed-files@v47
        with:
          files: |
            **/*.md

      - name: Lint changed Markdown files
        run: |
          if [ -n "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            pnpm exec markdownlint-cli2 ${{ steps.changed-files.outputs.all_changed_files }}
          else
            echo "No markdown files changed."
          fi

  lint-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get changed code files
        id: changed-files
        uses: step-security/changed-files@v47
        with:
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx

      - name: Lint changed code files
        run: |
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -n "$FILES" ]; then
            FRONTEND_FILES=$(echo "$FILES" | tr ' ' '\n' | sed 's|^frontend/||' | tr '\n' ' ')
            pnpm --filter frontend run lint:ci:oxlint -- $FRONTEND_FILES
            pnpm --filter frontend run lint:ci:eslint -- $FRONTEND_FILES
          else
            echo "No code files changed."
          fi
