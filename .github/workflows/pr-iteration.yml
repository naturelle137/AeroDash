name: Bounded PR Iteration & Ready Gate

# Drives BOT-authored Draft PRs (feature/issue-*) toward "Ready for review" while
# ingesting BOTH reviewer feedback and CI/pipeline results. Governed by ADR-317-DEV.
#
# State machine (same-repo bot Draft PRs only):
#   * review requested changes  OR  CI failed  -> correction (ingests review + CI
#     logs), bounded to MAX_CORRECTIONS rounds; on exhaustion -> stay Draft + summary.
#   * CI green AND a clean (non-changes-requested) review exists -> mark Ready + comment.
#   * any uncertainty (checks pending, no review yet, red CI) -> stay Draft (fail-safe).
#
# Safety: never merges; only marks Ready when CI is green; P1/safety-critical still
# requires human Lead review (branch protection) and is never auto-merged.
# refs #320, #316

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    # React to EVERY PR-gating workflow, not just CI. A red DoD/Security/E2E/
    # Traceability/branching gate must also drive a correction — otherwise a PR
    # whose CI is green but another gate is red sits red forever with no action.
    # `Autonomous PR Reviewer` is listed defensively: a `pull_request_review`
    # event fires while the reviewer workflow's own check is still in_progress
    # (the review is submitted a few seconds before the workflow run reports
    # `completed`), and the orchestrator's pending-gate (below) used to count
    # that check as pending and refuse to act. The race is fixed at the source
    # by excluding the reviewer's check from the pending-set, but listing the
    # workflow here also makes the loop self-healing for any other transient
    # race that ever leaves the orchestrator with a `wait` verdict.
    workflows:
      - CI
      - DoD Attestation Gate
      - Security Scanning
      - Traceability Gate
      - E2E Tests (Playwright)
      - Enforce Branching Model
      - Autonomous PR Reviewer
    types: [completed]

# Serialise per branch across BOTH trigger types so the correction budget is honoured.
concurrency:
  group: pr-iteration-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  id-token: write # required by anthropics/claude-code-action (OIDC)

env:
  MODEL: claude-opus-4-7
  MAX_CORRECTIONS: '2'
  # A correction round runs the full pipeline + fixes; 40 turns proved too small
  # for the implementer (see overnight-implementation.yml), so give corrections
  # comparable headroom. Aligned with overnight-implementation.yml and
  # pr-review-bot.yml at 150 so all three bots share one budget knob; kept
  # below the 60-min job timeout so the turn cap still binds first.
  MAX_TURNS: '150'

jobs:
  orchestrate:
    name: Iterate / ready-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ── Decide what to do from the triggering event + live PR/CI/review state ──
      - name: Resolve action
        id: ctx
        uses: actions/github-script@v9
        env:
          MAX_CORRECTIONS: ${{ env.MAX_CORRECTIONS }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const slug = `${owner}/${repo}`;
            const max = Number(process.env.MAX_CORRECTIONS);
            const out = (o) => { for (const [k, v] of Object.entries(o)) core.setOutput(k, String(v)); };
            const none = (why) => { core.info(`No action: ${why}`); out({ action: 'none' }); };

            // 1) Identify the PR from the triggering event (review or ANY gate workflow).
            let prNumber, headRef;
            if (context.eventName === 'pull_request_review') {
              const pr = context.payload.pull_request;
              if (pr.head.repo.full_name !== slug) return none('fork PR');
              prNumber = pr.number; headRef = pr.head.ref;
            } else { // workflow_run from one of the gating workflows
              const wr = context.payload.workflow_run;
              if (wr.event !== 'pull_request') return none('not a PR-triggered run');
              if (wr.head_repository.full_name !== slug) return none('fork PR');
              headRef = wr.head_branch;
              const prs = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${headRef}` });
              if (!prs.data.length) return none('no open PR for branch');
              prNumber = prs.data[0].number;
            }
            if (!headRef || !headRef.startsWith('feature/issue-')) return none('not a bot branch');

            // 2) Live PR state — evaluate against the CURRENT head (events can be stale).
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.state !== 'open') return none('PR not open');
            const headSha = pr.head.sha;

            // 3) Correction budget (counted via hidden comment markers).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const used = comments.filter((c) => (c.body || '').includes('<!-- auto-correction:')).length;

            // 4) Latest review verdict. The bot NEVER approves (ADR invariant 3), so a
            //    COMMENT review with no changes requested counts as a CLEAN review.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const verdicts = reviews.filter((r) => ['CHANGES_REQUESTED', 'APPROVED', 'COMMENTED'].includes(r.state));
            const last = verdicts[verdicts.length - 1];
            const changesRequested = Boolean(last) && last.state === 'CHANGES_REQUESTED';
            const reviewClean = Boolean(last) && last.state !== 'CHANGES_REQUESTED';

            // 5) Aggregate check state on the current head — EVERY gate, not just CI.
            //    Exclude this workflow's own check to avoid a self-referential race,
            //    AND exclude the reviewer's check ('Automated review' from
            //    pr-review-bot.yml): on a `pull_request_review.submitted` trigger the
            //    review is posted ~20s BEFORE the reviewer workflow itself reports
            //    `completed`, so the orchestrator would otherwise see its sibling
            //    check as pending, decide `wait`, and never re-fire (PR #346 was
            //    stuck this way until this fix). The reviewer's verdict is already
            //    consumed via the `reviews` API above; its check-run status carries
            //    no extra information the orchestrator needs.
            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: headSha, per_page: 100,
            });
            const SELF_CHECKS = new Set(['Iterate / ready-gate', 'Automated review']);
            const relevant = checks.filter((c) => !SELF_CHECKS.has(c.name));
            const bad = new Set(['failure', 'cancelled', 'timed_out', 'action_required']);
            const pending = relevant.some((c) => c.status !== 'completed');
            const failed = relevant.some((c) => bad.has(c.conclusion));
            const ciGreen = relevant.length > 0 && !pending && !failed;

            // 6) Decide purely from live aggregate state (trigger-agnostic, fail-safe):
            //    * any gate failed OR review requested changes -> correct (bounded) / handoff;
            //    * all gates green AND a clean review AND still Draft -> mark Ready;
            //    * anything still pending / no review yet -> wait.
            let action = 'none';
            if (pending) {
              core.info('checks still pending — waiting');
            } else if (failed || changesRequested) {
              action = used < max ? 'correct' : 'handoff';
            } else if (pr.draft && ciGreen && reviewClean) {
              action = 'ready';
            }
            core.info(`draft=${pr.draft} pending=${pending} failed=${failed} ciGreen=${ciGreen} changesRequested=${changesRequested} reviewClean=${reviewClean} used=${used}/${max} -> ${action}`);
            out({ action, pr: prNumber, head_ref: headRef, next: used + 1, max });

      # ── Flip to Ready: CI green + clean review ──────────────────────────────────
      - name: Mark Ready for review
        if: ${{ steps.ctx.outputs.action == 'ready' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr ready "${{ steps.ctx.outputs.pr }}"
          gh pr comment "${{ steps.ctx.outputs.pr }}" --body \
            "🤖 CI is green and the automated review is clean — **marked Ready for your review**. Nothing is auto-merged; P1/safety-critical still requires human Lead approval (ADR-317-DEV)."

      # ── Hand off: correction budget exhausted ───────────────────────────────────
      - name: Hand off to humans
        if: ${{ steps.ctx.outputs.action == 'handoff' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.ctx.outputs.pr }}" --body \
            "🤖 **Automated cycle complete — awaiting your review.** After ${{ steps.ctx.outputs.max }} correction round(s) plus a final review, outstanding feedback or CI failures remain. Left as a Draft; no further automated corrections will run (ADR-317-DEV)."

      # ── Correct: address review feedback AND/OR CI failures ─────────────────────
      - name: Checkout PR branch
        if: ${{ steps.ctx.outputs.action == 'correct' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ctx.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: ${{ steps.ctx.outputs.action == 'correct' }}
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        if: ${{ steps.ctx.outputs.action == 'correct' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      # Pre-install so `pnpm` is on PATH and Husky hooks are active before the
      # agent runs the pipeline (same toolchain bootstrap as the implementer job;
      # without a pnpm setup the agent's `pnpm install` cannot resolve the binary).
      - name: Install dependencies
        if: ${{ steps.ctx.outputs.action == 'correct' }}
        run: pnpm install --frozen-lockfile

      - name: Ensure Draft & configure git
        if: ${{ steps.ctx.outputs.action == 'correct' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr ready "${{ steps.ctx.outputs.pr }}" --undo || true   # back to Draft while correcting
          git config user.name 'aerodash-bot'
          git config user.email 'aerodash-bot@users.noreply.github.com'
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Correct via Claude Code
        if: ${{ steps.ctx.outputs.action == 'correct' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API-key alternative: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The `correct` path here is triggered by `pull_request_review.submitted`
          # from our reviewer bot, whose initiating actor is `claude[bot]`. The
          # action's bot-actor safety gate refuses non-human initiators by default
          # (prevents bot↔bot loops; see the action's docs/security.md). Allow ONLY
          # `claude` — never `*`, which is documented as unsafe on public repos
          # because external Apps could invoke the action with attacker-controlled
          # prompts. Dependabot / github-actions / other bots commenting or pushing
          # on a bot branch still cannot initiate a correction round under this
          # allow-list.
          allowed_bots: 'claude'
          prompt: |
            You are correcting Draft PR #${{ steps.ctx.outputs.pr }}
            (correction ${{ steps.ctx.outputs.next }} of ${{ steps.ctx.outputs.max }}).

            Address ALL outstanding automated feedback on the CURRENT branch:
            1. The latest PR review's requested changes (read it and its line comments).
            2. Any failing check — inspect with `gh pr checks ${{ steps.ctx.outputs.pr }}`
               and `gh run view --log-failed` and fix the ROOT CAUSE (this includes
               non-CI gates: DoD, Security, Traceability, E2E).
            3. If the **DoD Attestation Gate** is red, the PR body closes an issue
               (`Closes`/`Fixes`) that still has unticked DoD items. Either genuinely
               COMPLETE and tick those items, or — if they cannot be honestly completed
               here (e.g. human-only) — `gh pr edit` the body to use `Refs #<n>` instead
               of `Closes`, leave the items unticked, and note what remains. NEVER tick a
               box you cannot verify, and keep the PR body on the repository template.

            Before committing, run the local pipeline and make it pass:
            `pnpm install --frozen-lockfile`, `pnpm lint`, `pnpm --filter frontend type-check`,
            `pnpm test:unit`, `pnpm test:integration`, `pnpm build`. Commit on the CURRENT branch.

            Hard rules (ADR-317-DEV — do not violate):
            - NEVER use --no-verify or bypass any gate.
            - Do NOT edit .github/workflows/**, secrets, or security configuration.
            - Do NOT merge, do NOT mark the PR ready-for-review — leave it Draft;
              the ready-gate flips it automatically once CI is green and review is clean.
            - For a pre-existing/unrelated CI failure (out of scope), do NOT hack around
              it — file a deduplicated `Bug` (a new one only if none open tracks it;
              otherwise comment on the existing one) and note it in the PR.
            - If you cannot safely converge, stop and summarise what remains.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch,Skill"

      - name: Push correction & record round
        if: ${{ steps.ctx.outputs.action == 'correct' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR='${{ steps.ctx.outputs.pr }}'
          N='${{ steps.ctx.outputs.next }}'
          MAX='${{ steps.ctx.outputs.max }}'
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            gh pr comment "$PR" --body \
              "<!-- auto-correction:${N} --> 🤖 Correction ${N}/${MAX}: no actionable change could be made automatically. Awaiting your review."
            exit 0
          fi
          # claude-code-action strips checkout's PAT auth and repoints origin at its
          # own token; plain `git push` does not read GH_TOKEN. Re-establish PAT auth
          # on a clean URL first (same fix as the implementer's push step).
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git push origin "HEAD:${{ steps.ctx.outputs.head_ref }}"
          gh pr comment "$PR" --body \
            "<!-- auto-correction:${N} --> 🤖 Correction ${N}/${MAX}: pushed a revision addressing review feedback and/or CI failures. CI + re-review will run automatically; the PR is marked Ready once green and clean. Still a Draft — human Lead review required for P1/safety-critical."
