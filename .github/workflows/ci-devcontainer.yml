# CI using the pre-built dev container image from GHCR.
# Image is published by publish-devcontainer.yml when .devcontainer/** changes.
# Lint runs in linting.yml; unit tests run in vitest.yml — both without the container.
# This workflow is reserved for tests that require the container (Playwright Chromium for E2E).

name: CI (dev container)

on:
  push:
    # Verify the dev container image on integration branches only.
    # PR E2E runs are handled by the e2e job in ci.yml instead.
    branches: [main, develop]

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aerodash-devcontainer:latest

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull dev container image (build inline as fallback)
        run: |
          docker pull ${{ env.IMAGE }} || \
            docker build -t ${{ env.IMAGE }} -f .devcontainer/Dockerfile .

      # E2E tests run inside the dev container image (Playwright Chromium pre-installed).
      # Uncomment when playwright.config projects include Chromium for CI.
